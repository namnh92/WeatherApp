name: iOS Unit Tests + Coverage

on:
  push:
    branches: [ master, feature/unit-test ]
  pull_request:
    branches: [ master, feature/unit-test ]

jobs:
  test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcodes
        run: ls /Applications | grep Xcode

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
        
      - name: Check iOS simulator runtimes/devices
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | head
          xcrun simctl list devices available

      - name: Boot iPhone 16 Pro (iOS 18.2)
        run: |
          set -euo pipefail

          UDID=$(xcrun simctl list devices "iOS 18.2" | \
            awk -F '[()]' '/iPhone 16 Pro/ {print $2; exit}')

          if [ -z "$UDID" ]; then
            echo "❌ Could not find iPhone 16 Pro on iOS 18.2"
            xcrun simctl list devices "iOS 18.2"
            exit 1
          fi

          echo "✅ Using simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run tests (with coverage) on simulator
        run: |
          set -euo pipefail

          xcodebuild test \
          -project WeatherApp.xcodeproj \
          -scheme WeatherApp \
          -testPlan WeatherApp \
          -destination 'platform=iOS Simulator,OS=18.2,name=iPhone 16 Pro' \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults.xcresult

      - name: Generate coverage report (xccov JSON)
        run: |
          set -euo pipefail
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Show coverage in GitHub Summary
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          data = json.load(open("coverage.json"))
          
          cov = data.get("lineCoverage")
          if cov is None:
            raise SystemExit("No lineCoverage found in coverage.json")

          percent = cov * 100.0
          print(f"Line Coverage: {percent:.2f}%")

          with open("/tmp/summary.md","w") as f:
            f.write(f"## Code Coverage\n\n**Line Coverage:** `{percent:.2f}%`\n")
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if coverage < 100%
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          data = json.load(open("coverage.json"))
          cov = data.get("lineCoverage", 0.0) * 100.0
          if cov < 100.0:
            raise SystemExit(f"Coverage {cov:.2f}% < 100%")
          print(f"Coverage OK: {cov:.2f}%")
          PY

      - name: Upload xcresult artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult

      - name: Upload coverage json artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.json
          path: coverage.json
