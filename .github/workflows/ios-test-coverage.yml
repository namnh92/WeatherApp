name: iOS Unit Tests + Coverage

on:
  push:
    branches:
      - master
      - feature/unit-test
  pull_request:
    branches:
      - master
      - feature/unit-test

jobs:
  test:
    runs-on: macos-14

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Select Xcode
      # -------------------------
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version
          xcode-select -p

      # -------------------------
      # Debug simulator environment
      # -------------------------
      - name: List simulator runtimes & device types
        run: |
          export DEVELOPER_DIR="${DEVELOPER_DIR}"
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | head -n 20

      # -------------------------
      # Create & boot simulator
      # -------------------------
      - name: Create and boot iOS simulator (CI)
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="${DEVELOPER_DIR}"

          # Pick latest available iOS runtime
          RUNTIME_ID=$(xcrun simctl list runtimes | \
            awk -F '[()]' '/iOS/ && /com.apple.CoreSimulator.SimRuntime.iOS/ {print $2}' | tail -n 1)

          if [ -z "${RUNTIME_ID:-}" ]; then
            echo "❌ No iOS simulator runtime found"
            xcrun simctl list runtimes
            exit 1
          fi

          echo "✅ Using runtime: $RUNTIME_ID"

          # Use a stable device type
          DEVTYPE_ID="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"

          # Create fresh simulator for CI
          UDID=$(xcrun simctl create "CI-iPhone" "$DEVTYPE_ID" "$RUNTIME_ID")
          echo "✅ Created simulator UDID: $UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

          # Boot simulator
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # Verify
          xcrun simctl list devices | grep "$UDID" || true

      # -------------------------
      # Show destinations (debug)
      # -------------------------
      - name: Show Xcode destinations
        run: |
          export DEVELOPER_DIR="${DEVELOPER_DIR}"
          xcodebuild -project WeatherApp.xcodeproj -scheme WeatherApp -showdestinations

      # -------------------------
      # Run tests with coverage
      # -------------------------
      - name: Run unit tests (with coverage)
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="${DEVELOPER_DIR}"

          xcodebuild test \
            -project WeatherApp.xcodeproj \
            -scheme WeatherApp \
            -testPlan WeatherApp \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -destination-timeout 120

      # -------------------------
      # Generate coverage JSON
      # -------------------------
      - name: Generate coverage report (xccov)
        run: |
          set -euo pipefail
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      # -------------------------
      # Show coverage in summary
      # -------------------------
      - name: Show coverage in GitHub Summary
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json

          with open("coverage.json") as f:
              data = json.load(f)

          cov = data.get("lineCoverage")
          if cov is None:
              raise SystemExit("No lineCoverage found in coverage.json")

          percent = cov * 100.0

          with open("/tmp/summary.md", "w") as f:
              f.write("## Code Coverage\n\n")
              f.write(f"**Line Coverage:** `{percent:.2f}%`\n")

          print(f"Line Coverage: {percent:.2f}%")
          PY

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      # -------------------------
      # Enforce 100% coverage
      # -------------------------
      - name: Fail if coverage < 100%
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json

          with open("coverage.json") as f:
              data = json.load(f)

          percent = data.get("lineCoverage", 0.0) * 100.0

          if percent < 100.0:
              raise SystemExit(f"❌ Coverage {percent:.2f}% < 100%")

          print(f"✅ Coverage OK: {percent:.2f}%")
          PY

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload xcresult artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult

      - name: Upload coverage json artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.json
          path: coverage.json